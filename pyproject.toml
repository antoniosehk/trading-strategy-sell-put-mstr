[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy-sell-put-mstr"
version = "1.0.1"
description = "Tastytrade mechanics for selling out-of-the-money cash-secured puts on US.MSTR with IBIT macro 200 SMA trend filter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antonio Sze-To", email = "antonioszeto@gmail.com" }
]
dependencies = [
    "trading-strategy-core>=0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/trading_strategy_sell_put_mstr"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
